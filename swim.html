<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Brontosaurus swim</title>
<style>
:root{--page:#F4F5F6;--ink:#16191C;--ink-2:#4A4F55;--line:#D5D9DE;--s1:#004C97;--s1-ink:#004C97;--card:#FFFFFF;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--page:#0E1012;--ink:#EEF0F2;--ink-2:#B4BAC1;--line:#2C3136;--s1-ink:#8DB8E8;--card:#171A1D}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:940px;margin:0 auto;padding:18px 12px 40px}
a.back{display:inline-block;font-size:14px;font-weight:600;color:var(--s1-ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--card)}
h1{font-size:22px;margin:14px 0 4px}
p{margin:0 0 12px;color:var(--ink-2);font-size:15px}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.12)}
canvas{display:block;width:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
</style>
<style id="toggle-sel">
button[aria-pressed="true"]:not(.dsbtn),[role="radio"][aria-checked="true"],.seg input[type=radio]:checked+label,[role="radiogroup"] input[type=radio]:checked+label{background:var(--s1)!important;color:#fff!important;border-color:var(--s1-ink)!important;box-shadow:inset 0 0 0 1px var(--s1-edge)!important;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(button[aria-pressed="true"]:not(.dsbtn),[role="radio"][aria-checked="true"],.seg input[type=radio]:checked+label,[role="radiogroup"] input[type=radio]:checked+label){background:#6FA8E8!important;color:#0b0d10!important;border-color:#9CC4F2!important;box-shadow:none!important}}
:root[data-theme="dark"] :is(button[aria-pressed="true"]:not(.dsbtn),[role="radio"][aria-checked="true"],.seg input[type=radio]:checked+label,[role="radiogroup"] input[type=radio]:checked+label){background:#6FA8E8!important;color:#0b0d10!important;border-color:#9CC4F2!important;box-shadow:none!important}
</style>
<style id="sec-lines">
:root{--secline:color-mix(in srgb,#004C97 58%,var(--line));--nxg:#1F8A4C;--nxbg:color-mix(in srgb,#1F8A4C 10%,var(--surface));--nxbg2:color-mix(in srgb,#1F8A4C 20%,var(--surface));--nxk:#17693A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--secline:color-mix(in srgb,#6FA8E8 50%,var(--line));--nxg:#46B874;--nxbg:color-mix(in srgb,#46B874 14%,var(--surface));--nxbg2:color-mix(in srgb,#46B874 26%,var(--surface));--nxk:#8FD9AE}}
:root[data-theme="dark"]{--secline:color-mix(in srgb,#6FA8E8 50%,var(--line));--nxg:#46B874;--nxbg:color-mix(in srgb,#46B874 14%,var(--surface));--nxbg2:color-mix(in srgb,#46B874 26%,var(--surface));--nxk:#8FD9AE}
main figure,main .card,main .dcard,main .hcard,main section.controls,main .learn>section,main .out>div,main figure.tfig,main section.jb{border-color:var(--secline)!important}
main section.part{border-top:1px solid var(--secline)!important;padding-top:18px!important;margin-top:30px!important}
main section.part:first-child{margin-top:8px!important}
main h2.jbh{border-top:1px solid var(--secline);padding-top:18px;margin-top:30px!important}
.pager a.nx{background:var(--nxbg);border:1.5px solid var(--nxg);animation:nxpulse 2.6s ease-in-out infinite}
.pager a.nx .k{color:var(--nxk)}
.pager a.nx:hover{background:var(--nxbg2);border-color:var(--nxg)}
@keyframes nxpulse{0%,100%{background:var(--nxbg);box-shadow:0 0 0 0 color-mix(in srgb,var(--nxg) 0%,transparent)}50%{background:var(--nxbg2);box-shadow:0 0 0 5px color-mix(in srgb,var(--nxg) 22%,transparent)}}
@media (prefers-reduced-motion:reduce){.pager a.nx{animation:none}}
</style>
</head>
<body>
<main>
  <a class="back" href="3-skew-and-kurtosis.html#pg">← Back to Module 3</a>
  <h1>Brontosaurus swim</h1>
  <p id="intro">You found the hidden game. Tap, click or press the space bar to make the brontosaurus leap, and clear as many things as you can.</p>
  <div class="stage"><canvas id="c" aria-label="A brontosaurus swims while things float toward it. Tap, click or press the space bar to jump." role="img"></canvas></div>
</main>
<script>
(function(){
"use strict";
const who=(new URLSearchParams(location.search).get('who')||'').toLowerCase();
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dark=()=>window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
const WH=300,WL=212;            // world height and waterline, in world units
let WW=600,scale=1,dpr=1;       // world width depends on the screen's shape

/* ---------- sizing ---------- */
function resize(){const w=cv.parentElement.clientWidth,h=Math.max(220,Math.min(360,Math.round(w*0.46)));
  dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px';
  scale=h/WH;WW=w/scale;}
window.addEventListener('resize',resize);resize();

/* ---------- state ---------- */
const DX=110;                                 // brontosaurus position
const G=1000,V0=486;                          // gravity and jump speed (world units per second): a 118-unit leap lasting about 0.97 s
const S0=336,SMAX=700,ACC=4.2;                // speed in world units per second: start, cap (below the classic game's), and gain per second
const RESCUE_AT=200;                          // past this score the Carpathia comes
let carp=false,state='ready',t=0,spd=S0,lift=0,vy=0,air=false,score=0,obs=[],nextGap=0,parts=[],best=0,clouds=[],stars=[];
try{best=+localStorage.getItem('brontoSwimBest')||0;}catch(e){}
for(let i=0;i<5;i++)clouds.push({x:Math.random()*900,y:20+Math.random()*70,s:0.6+Math.random()*0.7});
for(let i=0;i<40;i++)stars.push({x:Math.random(),y:Math.random()*0.55,r:Math.random()*1.2+0.3});

/* ---------- items: Titanic and class themed ---------- */
const KINDS=[ // weight, width, height above the water
  {k:'ice',wt:22,w:44,h:36},{k:'door',wt:16,w:56,h:12},{k:'boat',wt:13,w:66,h:32},{k:'ship',wt:11,w:76,h:46},
  {k:'beans',wt:9,w:38,h:24},{k:'pcube',wt:12,w:30,h:30},{k:'ring',wt:10,w:30,h:28},{k:'bottle',wt:8,w:38,h:14}];
const TOT=KINDS.reduce((s,k)=>s+k.wt,0);
let recent=[],doorN=0;
function pick(){for(let tries=0;tries<8;tries++){let r=Math.random()*TOT,c=KINDS[0];for(const k of KINDS){if((r-=k.wt)<0){c=k;break;}}
    if(!(recent.length===2&&recent[0]===c.k&&recent[1]===c.k))return c;}return KINDS[0];}
// spacing: mostly varied, sometimes tight, sometimes a breather. Even the tightest gap (1.15 s) leaves room to land and leap again.
function gapTime(){const r=Math.random();return r<0.35?1.15+Math.random()*0.35:r<0.75?1.5+Math.random()*0.9:2.4+Math.random()*1.6;}
function spawn(){if(carp)return;if(score>=RESCUE_AT){carp=true;obs.push({k:'carpathia',w:430,h:132,x:WW+40,seed:0,done:true});nextGap=1e9;return;}
  const k=pick();recent=[recent[recent.length-1],k.k].filter(Boolean);const o={...k,x:WW+20,seed:Math.random()*1000,done:false,iceH:k.k==='ice'?28+Math.random()*10:0};
  if(k.k==='door'&&++doorN%10===0){o.fiddle=true;o.h=36;}                // every tenth door has a violinist, still playing
  obs.push(o);nextGap=(spd*gapTime()+k.w)/spd;}

function reset(){carp=false;recent=[];doorN=0;t=0;spd=S0;lift=0;vy=0;air=false;score=0;obs=[];parts=[];nextGap=0.6;state='play';}
function jump(){if(state==='ready'){reset();}
  else if(state==='over'){if(t>0.45)reset();return;}
  else if(state==='rescued'){if(t>0.6)location.href='practice-titanic.html';return;}
  if(!air){air=true;vy=V0;splash(DX+10,WL,10,1);}}
function splash(x,y,n,p){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-0.5)*40,y,vx:(Math.random()-0.5)*160*p,vy:-(80+Math.random()*200)*p,life:0.6+Math.random()*0.4});}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});

/* ---------- hit boxes ---------- */
function dinoBoxes(){const cy=WL+18-lift;return [
  {x0:DX-44,x1:DX+32,y0:cy-20,y1:cy+14},      // body
  {x0:DX+28,x1:DX+60,y0:cy-70,y1:cy-18}];}    // neck and head
function obsBoxes(o){const bob=Math.sin(t*3+o.seed)*1.5,B=(a,b,h)=>({x0:o.x+a,x1:o.x+b,y0:WL-h+4+bob,y1:WL+4});
  if(o.k==='ship')return [B(4,o.w-4,26),B(18,54,o.h)];               // hull, then the funnels
  if(o.k==='ice')return [B(6,o.w-6,o.iceH)];
  if(o.k==='door'&&o.fiddle)return [B(4,o.w-4,12),B(20,36,o.h)];
  if(o.k==='ring')return [B(3,o.w-3,o.h)];
  if(o.k==='carpathia')return [B(0,o.w,62),B(70,330,96),B(150,180,o.h)];
  return [B(4,o.w-4,o.h)];}
const hit=(a,b)=>a.x0<b.x1&&a.x1>b.x0&&a.y0<b.y1&&a.y1>b.y0;

/* ---------- update ---------- */
function update(dt){t+=dt;
  if(state==='play'){spd=Math.min(SMAX,spd+ACC*dt);const v=spd;
    obs.forEach(o=>o.x-=v*dt);obs=obs.filter(o=>o.x+o.w>-40);
    nextGap-=dt;if(nextGap<=0)spawn();
    if(air){lift+=vy*dt;vy-=G*dt;if(lift<=0){lift=0;vy=0;air=false;splash(DX,WL,12,0.8);}}
    const D=dinoBoxes();
    for(const o of obs){const Bs=obsBoxes(o);if(D.some(d=>Bs.some(B=>hit(d,B)))){
        if(o.k==='carpathia'){state='rescued';t=0;if(air&&lift>40){lift=Math.max(lift,WL+18+14-(WL-62));air=false;vy=0;}}
        else{state='over';t=0;splash(DX+20,WL,40,1.6);}
        if(score>best){best=score;try{localStorage.setItem('brontoSwimBest',String(best));}catch(e){}}break;}
      if(!o.done&&o.x+o.w<DX-44){o.done=true;score++;}}}
  if(state==='rescued'&&t>3.6&&!update.left){update.left=true;location.href='practice-titanic.html';}
  clouds.forEach(c=>{c.x-=(state==='play'?spd*0.06:8)*dt*c.s;if(c.x<-120)c.x=WW+60+Math.random()*200;});
  parts.forEach(p=>{p.x+=p.vx*dt-(state==='play'?spd*dt*0.5:0);p.y+=p.vy*dt;p.vy+=900*dt;p.life-=dt;});parts=parts.filter(p=>p.life>0&&p.y<WL+30);}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const INK=()=>dark()?'#0B0D0F':'#16191C',GREEN='#A9CE8E',GREEN_D='#7FAE63';

function drawDino(){const cx=DX,cy=WL+18-lift+(air?0:Math.sin(t*3.2)*2);ctx.lineJoin='round';ctx.lineCap='round';
  // legs (only seen when it leaps)
  ctx.fillStyle=INK();[-36,-20,6,20].forEach(dx=>{rr(cx+dx-3.5,cy+10,7,16,3.5);ctx.fill();});
  // neck
  ctx.beginPath();ctx.moveTo(cx+22,cy-12);ctx.bezierCurveTo(cx+34,cy-38,cx+44,cy-60,cx+58,cy-68);
  ctx.strokeStyle=INK();ctx.lineWidth=15;ctx.stroke();ctx.strokeStyle=GREEN;ctx.lineWidth=10;ctx.stroke();
  // body
  ctx.beginPath();ctx.moveTo(cx-82,cy+3);ctx.quadraticCurveTo(cx-50,cy-3,cx-28,cy-14);ctx.bezierCurveTo(cx-12,cy-25,cx+18,cy-25,cx+34,cy-9);
  ctx.bezierCurveTo(cx+43,cy+1,cx+38,cy+16,cx+20,cy+17);ctx.lineTo(cx-30,cy+16);ctx.quadraticCurveTo(cx-56,cy+12,cx-82,cy+3);ctx.closePath();
  ctx.fillStyle=GREEN;ctx.fill();ctx.strokeStyle=INK();ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-18,cy-12);ctx.quadraticCurveTo(cx,cy-18,cx+16,cy-12);ctx.strokeStyle=GREEN_D;ctx.lineWidth=2;ctx.stroke();
  // head
  const hx=cx+64,hy=cy-71;ctx.save();ctx.translate(hx,hy);ctx.rotate(-0.17);
  ctx.beginPath();ctx.ellipse(0,0,13,8.5,0,0,Math.PI*2);ctx.fillStyle=GREEN;ctx.fill();ctx.strokeStyle=INK();ctx.lineWidth=2.6;ctx.stroke();ctx.restore();
  ctx.fillStyle=INK();ctx.beginPath();ctx.arc(hx+5,hy-2.5,1.9,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(hx+11,hy+3);ctx.quadraticCurveTo(hx+7,hy+6.5,hx+2,hy+5);ctx.lineWidth=1.6;ctx.strokeStyle=INK();ctx.stroke();
  if(who==='edwards')drawHair(hx,hy);
  if(who==='cheney')drawHeart(cx+20,cy-3);}

function drawHair(hx,hy){const k=1.45,P=(x,y)=>[hx+x*k,hy+y*k];ctx.save();ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(...P(-11,-1));ctx.bezierCurveTo(...P(-15,-10),...P(-9,-20),...P(0,-21));ctx.bezierCurveTo(...P(9,-22),...P(17,-17),...P(18,-9));
  ctx.bezierCurveTo(...P(19,-4),...P(16,-1),...P(13,-2));ctx.bezierCurveTo(...P(14,-7),...P(10,-10),...P(6,-8));ctx.bezierCurveTo(...P(2,-6),...P(-5,-4),...P(-11,-1));ctx.closePath();
  ctx.fillStyle='#F6D55C';ctx.fill();ctx.strokeStyle='#7A5C12';ctx.lineWidth=1.6;ctx.stroke();
  ctx.beginPath();ctx.moveTo(...P(-9,-5));ctx.bezierCurveTo(...P(-8,-14),...P(2,-18),...P(11,-15));ctx.moveTo(...P(-5,-5));ctx.bezierCurveTo(...P(-2,-12),...P(6,-14),...P(14,-10));
  ctx.strokeStyle='#C49A22';ctx.lineWidth=1.1;ctx.stroke();
  // the hair holds perfectly still through every leap, and it sparkles
  const [sx,sy]=P(21,-19),tw=1+Math.sin(t*6)*0.35;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=(i%2?1.4:4.2)*tw;ctx.lineTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r);}ctx.closePath();ctx.fillStyle='#FFE680';ctx.fill();ctx.restore();}

function drawHeart(x,y){const k=1.6,P=(a,b)=>[x+a*k,y+b*k];ctx.save();
  ctx.beginPath();ctx.moveTo(...P(0,7));ctx.bezierCurveTo(...P(-9,1),...P(-9,-6),...P(-4.5,-6));ctx.bezierCurveTo(...P(-1.5,-6),...P(0,-4),...P(0,-2.5));
  ctx.bezierCurveTo(...P(0,-4),...P(1.5,-6),...P(4.5,-6));ctx.bezierCurveTo(...P(9,-6),...P(9,1),...P(0,7));ctx.closePath();
  ctx.fillStyle='#AEB8C2';ctx.fill();ctx.strokeStyle=INK();ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#4E5862';[[-5.2,-3],[5.2,-3],[0,4.2]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(...P(a,b),1.1,0,Math.PI*2);ctx.fill();});
  ctx.beginPath();ctx.arc(...P(0,-0.6),2.7*k,0,Math.PI*2);ctx.fillStyle='#EEF2F5';ctx.fill();ctx.strokeStyle='#4E5862';ctx.lineWidth=1;ctx.stroke();
  const a=-0.9+Math.sin(t*7)*0.5;ctx.beginPath();ctx.moveTo(...P(0,-0.6));ctx.lineTo(x+Math.cos(a)*3.6*k,y-0.6*k+Math.sin(a)*3.6*k);ctx.strokeStyle='#B3261E';ctx.lineWidth=1.3;ctx.stroke();
  ctx.restore();}

function drawItem(o){const bob=Math.sin(t*3+o.seed)*1.5,x=o.x,y=WL+bob;ctx.save();ctx.lineJoin='round';
  if(o.k==='ice'){const h=o.iceH,w=o.w;ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x+6,y-h*0.5);ctx.lineTo(x+14,y-h*0.62);ctx.lineTo(x+20,y-h);ctx.lineTo(x+28,y-h*0.72);ctx.lineTo(x+35,y-h*0.8);ctx.lineTo(x+w,y+4);ctx.closePath();
    const ig=ctx.createLinearGradient(x,y-h,x+w,y);ig.addColorStop(0,'#FFFFFF');ig.addColorStop(1,'#BFE0F4');ctx.fillStyle=ig;ctx.fill();ctx.strokeStyle=dark()?'#9FD0F0':'#2F6E9E';ctx.lineWidth=2.2;ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+20,y-h);ctx.lineTo(x+22,y-h*0.35);ctx.lineTo(x+28,y-h*0.72);ctx.closePath();ctx.fillStyle='#8EC3E6';ctx.fill();
    ctx.beginPath();ctx.moveTo(x+28,y-h*0.72);ctx.lineTo(x+31,y-h*0.2);ctx.lineTo(x+35,y-h*0.8);ctx.closePath();ctx.fillStyle='#A9D2EE';ctx.fill();}
  else if(o.k==='door'){ctx.translate(x+o.w/2,y-5);ctx.rotate(-0.07+Math.sin(t*2+o.seed)*0.03);
    rr(-o.w/2,-5,o.w,10,2);ctx.fillStyle='#8B5A2B';ctx.fill();ctx.strokeStyle='#4E3217';ctx.lineWidth=1.4;ctx.stroke();
    ctx.strokeStyle='#6B4220';ctx.lineWidth=1;[-o.w/2+5,-2].forEach(px=>{ctx.strokeRect(px,-3,o.w/2-8,6);});ctx.fillStyle='#E2B23C';ctx.beginPath();ctx.arc(o.w/2-4,0,1.4,0,Math.PI*2);ctx.fill();
    if(o.fiddle){// a violinist in band uniform, still playing
      const UNI=dark()?'#6F8CBF':'#22304A',UNI2=dark()?'#5A75A3':'#1B2433';
      ctx.rotate(0.07);const fx=0,fb=-5;ctx.lineCap='round';
      ctx.strokeStyle=UNI2;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(fx-2,fb);ctx.lineTo(fx-2,fb-10);ctx.moveTo(fx+2,fb);ctx.lineTo(fx+2,fb-10);ctx.stroke();
      ctx.fillStyle=UNI;rr(fx-4.5,fb-21,9,12,2.5);ctx.fill();ctx.fillStyle='#E2B23C';[0,1,2].forEach(i=>{ctx.beginPath();ctx.arc(fx,fb-19+i*3.5,0.7,0,Math.PI*2);ctx.fill();});
      ctx.fillStyle='#F1C27D';ctx.beginPath();ctx.arc(fx+0.5,fb-25,3.6,0,Math.PI*2);ctx.fill();ctx.fillStyle=UNI;ctx.fillRect(fx-3.5,fb-30,8,2.6);ctx.fillRect(fx-2.5,fb-32,6,2.4);
      ctx.save();ctx.translate(fx+4,fb-21);ctx.rotate(-0.45);ctx.fillStyle='#8B3A12';ctx.beginPath();ctx.ellipse(4,0,4.5,2.4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3A1A08';ctx.fillRect(8,-0.6,5,1.2);ctx.restore();
      const ba=-0.35+Math.sin(t*9)*0.28;ctx.strokeStyle=UNI;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(fx-3,fb-18);ctx.lineTo(fx-6,fb-14);ctx.stroke();
      ctx.strokeStyle='#D9C7A0';ctx.lineWidth=0.9;ctx.beginPath();ctx.moveTo(fx-6+Math.cos(ba)*-6,fb-14+Math.sin(ba)*-6);ctx.lineTo(fx-6+Math.cos(ba)*12,fb-14+Math.sin(ba)*12);ctx.stroke();
      ctx.fillStyle=dark()?'#DDE7F2':UNI;ctx.font='7px Georgia,serif';ctx.textAlign='center';ctx.fillText('♪',fx+12+Math.sin(t*3)*2,fb-30-((t*12)%8));}}
  else if(o.k==='ring'){// a life ring
    const cx=x+15,cy=y-12;ctx.translate(cx,cy);ctx.rotate(Math.sin(t*2+o.seed)*0.1);
    for(let q=0;q<8;q++){ctx.beginPath();ctx.arc(0,0,11.5,q*Math.PI/4,(q+1)*Math.PI/4);ctx.strokeStyle=q%2?'#FFFFFF':'#D32F2F';ctx.lineWidth=7;ctx.stroke();}
    ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.arc(0,0,8,0,Math.PI*2,true);ctx.strokeStyle='#5D4037';ctx.lineWidth=1;ctx.stroke();
    ctx.setLineDash([2,3]);ctx.beginPath();ctx.arc(0,0,11.5,0,Math.PI*2);ctx.strokeStyle='#C8B48A';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);}
  else if(o.k==='bottle'){// a message in a bottle; the note inside says H0
    ctx.translate(x+19,y-6);ctx.rotate(-0.12+Math.sin(t*2.4+o.seed)*0.06);
    ctx.beginPath();ctx.moveTo(-17,-6);ctx.lineTo(6,-6);ctx.quadraticCurveTo(10,-6,12,-3);ctx.lineTo(16,-3);ctx.lineTo(16,3);ctx.lineTo(12,3);ctx.quadraticCurveTo(10,6,6,6);ctx.lineTo(-17,6);ctx.quadraticCurveTo(-19,0,-17,-6);ctx.closePath();
    ctx.fillStyle='rgba(76,150,96,.55)';ctx.fill();ctx.strokeStyle='#2E6B3F';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='#A0773F';ctx.fillRect(16,-2.6,4,5.2);
    ctx.fillStyle='#F3E6C4';ctx.fillRect(-13,-3.6,16,7.2);ctx.fillStyle='#5D4037';ctx.font='700 6.5px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('H₀',-5,0.4);
    ctx.beginPath();ctx.moveTo(-14,-4.5);ctx.lineTo(4,-4.5);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;ctx.stroke();}
  else if(o.k==='boat'){// a lifeboat full of women and children, all waving
    const people=[{dx:12,h:15,c:'#B3261E',s:'#F1C27D'},{dx:22,h:10,c:'#2E7D32',s:'#C68642'},{dx:32,h:15,c:'#6A1B9A',s:'#8D5524'},{dx:42,h:10,c:'#F9A825',s:'#F1C27D'},{dx:52,h:14,c:'#1565C0',s:'#E0AC69'}];
    people.forEach((p,i)=>{const px=x+p.dx,top=y-10-p.h;ctx.fillStyle=p.c;rr(px-4,top+6,8,p.h-2,3);ctx.fill();
      ctx.beginPath();ctx.arc(px,top+3,3.6,0,Math.PI*2);ctx.fillStyle=p.s;ctx.fill();
      const a=-1.2+Math.sin(t*8+i*1.7)*0.5;ctx.beginPath();ctx.moveTo(px+3,top+8);ctx.lineTo(px+3+Math.cos(a)*8,top+8+Math.sin(a)*8);ctx.strokeStyle=p.s;ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();});
    ctx.beginPath();ctx.moveTo(x,y-12);ctx.lineTo(x+o.w,y-12);ctx.quadraticCurveTo(x+o.w-4,y+4,x+o.w-14,y+4);ctx.lineTo(x+12,y+4);ctx.quadraticCurveTo(x+3,y+4,x,y-12);ctx.closePath();
    ctx.fillStyle='#FAFAF7';ctx.fill();ctx.strokeStyle='#5D4037';ctx.lineWidth=1.6;ctx.stroke();ctx.fillStyle='#A1764B';ctx.fillRect(x+1,y-13,o.w-2,3);}
  else if(o.k==='ship'){// a small ocean liner with four tall funnels
    ctx.fillStyle='#1B1E22';ctx.beginPath();ctx.moveTo(x,y-18);ctx.lineTo(x+o.w,y-18);ctx.lineTo(x+o.w-7,y+3);ctx.lineTo(x+6,y+3);ctx.closePath();ctx.fill();
    ctx.fillStyle='#A3291F';ctx.fillRect(x+5,y-1,o.w-11,4);
    ctx.fillStyle='#F4F1E8';ctx.strokeStyle='#8A8578';ctx.lineWidth=0.8;ctx.fillRect(x+7,y-26,o.w-14,8);ctx.strokeRect(x+7,y-26,o.w-14,8);ctx.fillRect(x+13,y-31,o.w-30,5);ctx.strokeRect(x+13,y-31,o.w-30,5);
    ctx.fillStyle='#2A2E33';for(let i=0;i<11;i++){ctx.beginPath();ctx.arc(x+8+i*6.2,y-11,1.1,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#9AA0A6';for(let i=0;i<9;i++)ctx.fillRect(x+10+i*6.6,y-24,3,3);
    [0,1,2,3].forEach(i=>{const fx=x+19+i*9.5;ctx.fillStyle='#E1A841';ctx.fillRect(fx,y-47,6.5,17);ctx.fillStyle='#1B1E22';ctx.fillRect(fx,y-47,6.5,4.5);});
    ctx.strokeStyle='#3A3F45';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+8,y-26);ctx.lineTo(x+10,y-52);ctx.moveTo(x+o.w-8,y-26);ctx.lineTo(x+o.w-10,y-50);ctx.stroke();}
  else if(o.k==='carpathia'){// the rescue ship: far too big to leap over
    const w=o.w;ctx.fillStyle='#1E2226';ctx.beginPath();ctx.moveTo(x-14,y-62);ctx.lineTo(x+w,y-62);ctx.lineTo(x+w-12,y+4);ctx.lineTo(x+14,y+4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#9E2A20';ctx.fillRect(x+10,y-4,w-24,8);
    ctx.fillStyle='#F2EEE3';ctx.fillRect(x+70,y-96,260,34);ctx.strokeStyle='#8A8578';ctx.lineWidth=1;ctx.strokeRect(x+70,y-96,260,34);
    ctx.fillStyle='#5B6168';for(let i=0;i<20;i++)ctx.fillRect(x+80+i*12.5,y-88,6,6);for(let i=0;i<20;i++)ctx.fillRect(x+80+i*12.5,y-76,6,6);
    ctx.fillStyle='#2A2E33';for(let i=0;i<26;i++){ctx.beginPath();ctx.arc(x+24+i*15,y-36,2.2,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#C8361E';ctx.fillRect(x+150,y-132,30,36);ctx.fillStyle='#14171A';ctx.fillRect(x+150,y-132,30,10);
    ctx.strokeStyle='#2A2E33';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+40,y-62);ctx.lineTo(x+44,y-150);ctx.moveTo(x+w-40,y-62);ctx.lineTo(x+w-44,y-146);ctx.stroke();
    ctx.fillStyle='#FFFFFF';ctx.font='700 21px Georgia,"Times New Roman",serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('CARPATHIA',x+18,y-44);
    ctx.font='700 9px Georgia,serif';ctx.fillText('LIVERPOOL',x+w-80,y-44);}
  else if(o.k==='beans'){const C=['#D32F2F','#FBC02D','#388E3C','#7B1FA2','#F57C00','#1976D2','#E91E63','#8BC34A','#5D4037'];let n=0;
    [[4,0],[3,1],[2,2]].forEach(([cnt,row])=>{for(let i=0;i<cnt;i++){const bx=x+6+row*4.5+i*9,by=y-4-row*7.5;ctx.save();ctx.translate(bx,by);ctx.rotate(((n*37)%7-3)*0.12);
      ctx.beginPath();ctx.ellipse(0,0,4.8,3.4,0,0,Math.PI*2);ctx.fillStyle=C[n%C.length];ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=0.8;ctx.stroke();
      ctx.beginPath();ctx.ellipse(-1.2,-1.2,1.4,0.7,0,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();ctx.restore();n++;}});}
  else if(o.k==='pcube'){const s=22,d=8,bx=x+2,by=y-s+2;
    ctx.fillStyle='#003A75';ctx.beginPath();ctx.moveTo(bx+s,by);ctx.lineTo(bx+s+d,by-d);ctx.lineTo(bx+s+d,by+s-d);ctx.lineTo(bx+s,by+s);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3D7CC4';ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+d,by-d);ctx.lineTo(bx+s+d,by-d);ctx.lineTo(bx+s,by);ctx.closePath();ctx.fill();
    ctx.fillStyle='#004C97';ctx.fillRect(bx,by,s,s);ctx.strokeStyle='#002A54';ctx.lineWidth=1;ctx.strokeRect(bx,by,s,s);
    ctx.fillStyle='#FFFFFF';ctx.font='700 7.6px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('p<.05',bx+s/2,by+s/2+0.5);}
  ctx.restore();}

function draw(){const nt=dark();ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  // sky
  const sk=ctx.createLinearGradient(0,0,0,WL);if(nt){sk.addColorStop(0,'#0B1630');sk.addColorStop(1,'#1E3354');}else{sk.addColorStop(0,'#BFE0F5');sk.addColorStop(1,'#EAF5FB');}
  ctx.fillStyle=sk;ctx.fillRect(0,0,WW,WL);
  if(nt){ctx.fillStyle='#FFFFFF';stars.forEach(s=>{ctx.globalAlpha=0.5+0.5*Math.sin(t*2+s.x*40);ctx.beginPath();ctx.arc(s.x*WW,s.y*WL,s.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}
  ctx.fillStyle=nt?'rgba(200,215,235,.18)':'rgba(255,255,255,.9)';clouds.forEach(c=>{ctx.beginPath();ctx.ellipse(c.x,c.y,28*c.s,9*c.s,0,0,Math.PI*2);ctx.ellipse(c.x+18*c.s,c.y-6*c.s,18*c.s,9*c.s,0,0,Math.PI*2);ctx.fill();});
  obs.forEach(drawItem);
  drawDino();
  // water over the submerged part of the brontosaurus
  const off=(state==='play'?t*spd:t*30)%40;
  const wg=ctx.createLinearGradient(0,WL,0,WH);if(nt){wg.addColorStop(0,'rgba(22,62,104,.9)');wg.addColorStop(1,'rgba(8,26,48,.98)');}else{wg.addColorStop(0,'rgba(46,111,168,.86)');wg.addColorStop(1,'rgba(20,64,110,.97)');}
  ctx.beginPath();ctx.moveTo(0,WH);for(let x=0;x<=WW+40;x+=8){ctx.lineTo(x,WL+Math.sin((x+off)/40*Math.PI*2)*2.2);}ctx.lineTo(WW+40,WH);ctx.closePath();ctx.fillStyle=wg;ctx.fill();
  ctx.strokeStyle=nt?'rgba(160,200,240,.35)':'rgba(255,255,255,.6)';ctx.lineWidth=1.4;for(let r=0;r<3;r++){ctx.beginPath();for(let x=-((off*(r+1)*0.7)%60);x<WW;x+=60){ctx.moveTo(x,WL+18+r*26);ctx.lineTo(x+18,WL+18+r*26);}ctx.stroke();}
  // spray
  ctx.fillStyle=nt?'rgba(200,225,255,.85)':'rgba(255,255,255,.95)';parts.forEach(p=>{ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.8));ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
  // text
  ctx.textBaseline='top';ctx.textAlign='right';ctx.font='700 15px system-ui,sans-serif';ctx.fillStyle=nt?'#EEF0F2':'#16191C';
  ctx.fillText(`Score ${score}   Best ${best}`,WW-14,12);
  ctx.textAlign='center';
  if(state==='ready'){panel(['Tap, click or press the space bar to start.','Each tap makes the brontosaurus leap.']);}
  if(state==='over'){panel([`Splash! You cleared ${score} ${score===1?'thing':'things'}.`,t>0.45?'Tap to swim again.':' ']);}
  if(state==='rescued'){panel(['You are one of the lucky ones.',`The Carpathia picked you up after you cleared ${score} things.`,'Taking you back to the Titanic practice now.']);}}
function panel(lines){const w=Math.min(WW-24,440),h=14+lines.length*21,x=(WW-w)/2,y=50;ctx.fillStyle=dark()?'rgba(14,16,18,.85)':'rgba(255,255,255,.92)';rr(x,y,w,h,10);ctx.fill();
  ctx.fillStyle=dark()?'#EEF0F2':'#16191C';lines.forEach((L,i)=>{ctx.font=(i?'':'700 ')+(i?13.5:15)+'px system-ui,sans-serif';ctx.fillText(L,WW/2,y+10+i*21,w-16);});}

let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
